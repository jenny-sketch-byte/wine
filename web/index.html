<title>Field Sheets: A Systematic Wine Primer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>

      --accent: #D97A9B;

    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1C1E; --surface: #232427; --surface-2: #29292C; --ink: #ECEAE3;
    --muted: #ADAFA6; --faint: #797C75; --line: #35363A;
    --accent: #D97A9B; --accent-ink: #2A1319; --accent-soft: #3A2029;
    --clay: #D3A26F; --clay-soft: #3A2E20;

    --muted: #5C6059; --faint: #8A8D85; --line: #D2D2C8;

  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
  table { font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 100vh;
  }
  body:not(.unlocked) .app { display: none; }
  body.unlocked .gate { display: none; }

  .gate {

    justify-content: center;

  .gate-box {

  /* ---------- Sidebar ---------- */
  .sidebar {

  .brand .sub { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.02em; }

  .nav-group { display: flex; flex-direction: column; gap: 0.15rem; }
  .nav-label {

    font-size: 0.68rem;
    letter-spacing: 0.12em;

    border: 1px solid transparent;

    text-align: left;
    font-size: 0.9rem;

  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .nav-item.active .nav-item-title { color: var(--accent); font-weight: 600; }
  .nav-item-title { flex: 1; }
  .chip {

    flex-shrink: 0;
  }
  .chip.started { background: var(--clay); }

  .sidebar-foot {

    flex-direction: column;

    text-align: left; padding: 0; cursor: pointer; text-decoration: underline;

  .reset-btn:hover { color: var(--bad); }

  .menu-toggle {

    position: fixed;
    top: 0.9rem; left: 0.9rem;
    z-index: 30;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;

    align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .menu-toggle span, .menu-toggle::before, .menu-toggle::after { display:none; }
  .menu-toggle .bars { display: flex; flex-direction: column; gap: 4px; }
  .menu-toggle .bars i { display:block; width: 18px; height: 2px; background: var(--ink); }

  /* ---------- Main ---------- */
  main { padding: 2.5rem 3rem 5rem; max-width: 780px; }

  .home-hero { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2.25rem; }
  .home-hero h1 { font-size: 2.4rem; }
  .home-hero p { color: var(--muted); font-size: 1rem; max-width: 58ch; }

  .home-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.ledger th {
    text-align: left; font-family: var(--font-mono); font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
    padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line);
  }
  table.ledger td { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--line); vertical-align: middle; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: var(--font-mono); font-size: 0.72rem;
  }

  .topic-header { margin-bottom: 1.75rem; }

  .signature-wrap { margin: 1.1rem 0 0.3rem; }

  .signature-caption {
    font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint);

  .table-wrap { overflow-x: auto; margin-bottom: 0.6rem; }

  table.data th {
    text-align: left; background: var(--surface-2); font-weight: 600;
    padding: 0.5rem 0.7rem; border: 1px solid var(--line); font-size: 0.82rem;
  }

  .callout {

  }
  .callout .callout-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--clay); margin-bottom: 0.4rem; display:block;
  }
  .callout blockquote { margin: 0; font-style: italic; color: var(--ink); }

  /* ---------- Quiz ---------- */
  .quiz-section { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 2px solid var(--line); }
  .quiz-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.1rem; gap: 1rem; flex-wrap: wrap; }
  .quiz-title-row h3 { font-size: 1.3rem; font-family: var(--font-display); }
  .quiz-score { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }

  .quiz-option:hover:not(:disabled) { border-color: var(--accent); }

    font-family: var(--font-mono); font-size: 0.78rem; color: var(--faint);
    min-width: 1.1rem;
  }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct { background: var(--good-soft); border-color: var(--good); }
  .quiz-option.correct .opt-letter { color: var(--good); }
  .quiz-option.incorrect { background: var(--bad-soft); border-color: var(--bad); }
  .quiz-option.incorrect .opt-letter { color: var(--bad); }
  .quiz-option.dimmed { opacity: 0.55; }

  .quiz-explain {
    margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--line);
    font-size: 0.86rem; color: var(--muted); display: none;
  }
  .quiz-explain.show { display: block; }
  .quiz-explain b { color: var(--ink); }

  .topic-nav { display: flex; justify-content: space-between; margin-top: 2.5rem; gap: 1rem; }
  .topic-nav-btn {
    display: flex; flex-direction: column; gap: 0.2rem; padding: 0.7rem 1rem;

  }
  .topic-nav-btn:hover { border-color: var(--accent); }
  .topic-nav-btn .tn-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .topic-nav-btn .tn-title { font-family: var(--font-display); font-size: 1rem; }
  .topic-nav-btn.next { text-align: right; align-items: flex-end; margin-left: auto; }

  @media (prefers-reduced-motion: no-preference) {
    .nav-item, .quiz-option, .topic-nav-btn, .reset-btn { transition: background-color .15s ease, border-color .15s ease, opacity .15s ease; }
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }

    .topic-header h2 { font-size: 1.6rem; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Practice hero / filters ---------- */
  .practice-hero { margin-bottom: 1.5rem; }
  .practice-hero h2 { font-size: 2rem; }
  .practice-hero p.sub { color: var(--muted); max-width: 62ch; margin-top: 0.7rem; }

  .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .filter-chip { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.35rem 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- Command word glossary ---------- */
  .glossary { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 1.75rem; }
  .glossary summary { cursor: pointer; padding: 0.8rem 1rem; font-family: var(--font-display); font-size: 1rem; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .glossary summary::-webkit-details-marker { display: none; }
  .glossary summary .he { font-family: var(--font-body); font-size: 0.85rem; color: var(--muted); }
  .glossary-body { padding: 0 1rem 1rem; }
  .glossary-row { display: grid; grid-template-columns: 130px 1fr; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px dashed var(--line); font-size: 0.86rem; }
  .glossary-row:first-child { border-top: none; }
  .glossary-row .gw { font-weight: 600; }
  .glossary-row .gw .he { display: block; font-size: 0.82em; color: var(--clay); font-weight: 400; margin-top: 0.1em; }

  /* ---------- Written practice ---------- */
  .written-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem 1.35rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
  .written-command { display: inline-flex; align-items: baseline; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); background: var(--clay-soft); padding: 0.25rem 0.6rem; border-radius: 5px; margin-bottom: 0.7rem; }
  .written-command .he { text-transform: none; letter-spacing: 0; }
  .written-q { font-size: 1.1rem; margin-bottom: 1rem; font-family: var(--font-display); }
  .written-textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); font-family: var(--font-body); font-size: 0.95rem; padding: 0.8rem; resize: vertical; }
  .written-textarea:focus { border-color: var(--accent); }
  .written-actions { display: flex; gap: 0.7rem; margin-top: 0.9rem; flex-wrap: wrap; }
  .btn { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.02em; padding: 0.6rem 1.1rem; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .reveal-block { margin-top: 1.3rem; padding-top: 1.1rem; border-top: 2px solid var(--line); }

  /* ---------- Scenario questions ---------- */
  .scenario-wine { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 0.3rem; }
  .scenario-context { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.4rem; }
  .scenario-part { border-top: 1px solid var(--line); padding-top: 1.2rem; margin-top: 1.2rem; }
  .scenario-part:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .scenario-part-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.6rem; }
  .scenario-part-head .marks { font-family: var(--font-mono); font-size: 0.72rem; color: var(--clay); white-space: nowrap; }
  .scenario-q { font-size: 1rem; margin-bottom: 0.9rem; }
  .scenario-model { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .scenario-model li { padding-left: 1rem; position: relative; font-size: 0.92rem; }
  .scenario-model li::before { content: "-"; position: absolute; left: 0; color: var(--good); }
  .jenny-note {
    margin-top: 0.9rem; background: var(--clay-soft); border: 1px solid color-mix(in srgb, var(--clay) 40%, transparent);
    border-radius: 8px; padding: 0.8rem 1rem; font-size: 0.9rem;
  }
  .jenny-note .callout-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--clay); margin-bottom: 0.4rem; display: block;
  }

  /* ---------- MCQ practice ---------- */
  .mcq-stats-row { display: flex; gap: 1.5rem; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
  .mcq-progress { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  .mcq-topic-tag { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--clay); margin-bottom: 0.5rem; display: block; }
  .theme-tag {
    display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.03em;
    color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 999px; padding: 0.15rem 0.6rem; margin-bottom: 0.6rem;
  }
  .written-anchor {
    font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin-bottom: 0.8rem;
    padding-bottom: 0.6rem; border-bottom: 1px dashed var(--line);
  }
  .mcq-summary-list { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .mcq-summary-item { padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 0.86rem; line-height: 1.5; }
  .mcq-summary-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .mcq-summary-item.right { border-color: var(--good); background: var(--good-soft); }

  /* ---------- Response Builder ---------- */
  .rb-badges { display: flex; gap: 0.6rem; align-items: center; margin: 0.9rem 0; }
  .rb-marks-badge { margin-bottom: 0; }
  .rb-tip { margin-bottom: 1rem; }
  .rb-progress-wrap { display: flex; align-items: center; gap: 0.9rem; margin: 1.3rem 0; }
  .rb-progress-bar { flex: 1; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .rb-progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .rb-progress-label { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .rb-reset-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 0.82rem; text-decoration: underline; white-space: nowrap; }

      id: "climate",
      group: "foundations",
      groupLabel: "Foundations",
      title: "Climate",
      tagline: "The macro and site-level factors that set every region's baseline: the concept every region sheet builds on.",
      signature: { low: 35, high: 68, rainfall: 0.6, note: "illustrative: the general pattern, not one place" },
      sections: [
        { h: "Macroclimate factors", body: `
          <div class="table-wrap"><table class="data">
            <tr><th>Factor</th><th>Effect</th></tr>
            <tr><td>Latitude</td><td>Lower latitude = more direct sun, warmer. Viable wine belt roughly 30–50° N/S.</td></tr>
            <tr><td>Altitude</td><td>Temperature drops ~0.6°C per 100m: high sites in warm latitudes recover cool-climate character.</td></tr>
            <tr><td>Proximity to water</td><td>Moderates temperature (slow to heat/cool) → smaller diurnal range, longer season, less frost risk.</td></tr>
            <tr><td>Ocean currents</td><td>Cold currents (Benguela, Humboldt) cool coastal regions well below their latitude's expectation.</td></tr>
            <tr><td>Wind</td><td>Cools and dries the canopy, can reduce disease pressure (e.g. the Mistral) or add vine stress if constant.</td></tr>
            <tr><td>Mountains / rain shadow</td><td>Block moisture-bearing winds, creating a dry zone on the leeward side.</td></tr>
          </table></div>` },
        { h: "Three climate types to know cold", body: `
          <ul>
            <li><strong>Maritime</strong>: ocean-moderated, narrow annual range, rain spread year-round, higher vintage variation (Bordeaux, Loire).</li>
            <li><strong>Continental</strong>: land-locked, wide annual range, hot summers/cold winters, more settled summers (Burgundy, Mendoza).</li>
            <li><strong>Mediterranean</strong>: warm/hot, dry summers, mild wet winters, low vintage variation (southern Rhône, much of Spain).</li>
          </ul>` },
        { h: "Diurnal range: the recurring concept", body: `
          <p>The gap between daytime high and nighttime low. A <strong>large diurnal range</strong> means warm days build sugar while cool nights preserve acidity and aromatics: common at altitude and in continental sites (Mendoza, Marlborough, Barossa foothills).</p>
          <div class="callout"><span class="callout-label">Sentence template</span>
          <blockquote>"The large diurnal range in [region] means grapes accumulate sugar during warm days while retaining acidity during cool nights, resulting in ripe fruit with a fresh, balanced structure."</blockquote></div>` },
        { h: "Hazards: know the mechanism, not just the name", body: `
          <div class="table-wrap"><table class="data">
            <tr><th>Hazard</th><th>Timing</th><th>Mechanism</th></tr>
            <tr><td>Spring frost</td><td>Bud burst</td><td>Ice forms in tissue, kills young shoots</td></tr>
            <tr><td>Hail</td><td>Growing season</td><td>Physical damage to leaves/fruit, can trigger rot</td></tr>
            <tr><td>Drought</td><td>Growing season</td><td>Vine stress; mild = concentration, severe = ripening shuts down</td></tr>
            <tr><td>Fungal disease</td><td>Warm, humid</td><td>Damages leaves/fruit, reduces yield and ripening capacity</td></tr>
            <tr><td>Grey rot</td><td>Wet conditions near harvest</td><td>Botrytis in unfavourable conditions: spoils fruit</td></tr>
          </table></div>` }
      ],
      quiz: [
        { theme: "Climate types", q: "Which climate type is land-locked with a wide annual temperature range and settled summers?", options: ["Maritime", "Continental", "Mediterranean", "Alpine"], correct: 1, explain: "Continental climates (Burgundy, Mendoza) lack a moderating water body, so summers and winters diverge sharply." },
        { theme: "Rain shadow", q: "A rain shadow is caused by:", options: ["Cold ocean currents", "Mountains blocking moisture-bearing winds", "Cold air sinking to valley floors", "High altitude alone"], correct: 1, explain: "A mountain range (Vosges, Andes) intercepts prevailing moisture-bearing winds, leaving the leeward side dry." },
        { theme: "Diurnal range", q: "A large diurnal range typically produces grapes with:", options: ["Low sugar, low acid", "High sugar, low acid", "High sugar while retaining acidity", "Low sugar, high acid"], correct: 2, explain: "Warm days build sugar; cool nights slow acid degradation: the combination prized in high-altitude and continental sites." },
        { theme: "Vintage variation", q: "Which vintage-variation risk is most associated with maritime climates at harvest time?", options: ["Spring frost", "Rain causing dilution or rot", "Extreme heat", "Wind during flowering"], correct: 1, explain: "Maritime climates spread rainfall through the year, so a wet spell right at harvest is the classic maritime vintage risk." }
      ]
    },
    {
      id: "viticulture",
      group: "foundations",
      groupLabel: "Foundations",
      title: "Viticulture",
      tagline: "Vineyard decisions that shape what arrives at the winery: training, canopy, yield, harvest, disease pressure.",
      sections: [
        { h: "Training & canopy management", body: `
          <ul>
            <li><strong>VSP</strong> (Vertical Shoot Positioning): narrow upright canopy, good exposure/airflow, mechanization-friendly, common in cool/moderate climates.</li>
            <li><strong>Bush vine (gobelet)</strong>: no wires, self-shading protects fruit in hot/dry/windy climates (old-vine Grenache, Chenin in South Africa).</li>
            <li><strong>Leaf removal</strong> in the fruit zone raises sun exposure and airflow: aids ripening and lowers rot risk, but risks sunburn in hot climates.</li>
          </ul>` },
        { h: "Yield control", body: `
          <p><strong>Pruning</strong> (winter) sets the maximum number of buds: the primary yield lever. <strong>Green harvest</strong> (dropping bunches mid-season) concentrates the remaining fruit but costs money and yield. Overcropping dilutes flavour concentration: yield control → concentration → quality/price tier is a standard exam link.</p>` },
        { h: "Irrigation", body: `
          <p>Essential in low-rainfall regions (see the <strong>Argentina</strong> sheet for the full worked example). <strong>Deficit irrigation</strong>, deliberately withholding water at controlled points, limits berry size and concentrates flavour. Flood/furrow is cheap but imprecise and promotes dilution; drip is precise and reduces yield. Many EU regions restrict irrigation for quality-tier wine; many New World regions treat it as essential and normal.</p>` },
        { h: "Harvest: hand vs machine", body: `
          <div class="table-wrap"><table class="data">
            <tr><th></th><th>Hand harvest</th><th>Machine harvest</th></tr>
            <tr><td>Selectivity</td><td>Can leave unripe/diseased bunches</td><td>Non-selective</td></tr>
            <tr><td>Cost</td><td>Higher</td><td>Lower</td></tr>
            <tr><td>Use case</td><td>Steep slopes, whole-bunch methods, sparkling base wine</td><td>Flat/accessible terrain, can pick at night for cool fruit</td></tr>
          </table></div>` },
        { h: "Disease pressure", body: `
          <div class="table-wrap"><table class="data">
            <tr><th>Issue</th><th>Conditions</th><th>Impact</th></tr>
            <tr><td>Powdery mildew</td><td>Warm, humid, low light</td><td>Coats leaves/fruit, stunts ripening</td></tr>
            <tr><td>Downy mildew</td><td>Warm, wet</td><td>Damages leaves, reduces photosynthesis/yield</td></tr>
            <tr><td>Grey rot</td><td>Wet/humid near harvest</td><td>Spoils fruit: must be sorted out</td></tr>
            <tr><td>Noble rot</td><td>Morning mist + afternoon sun</td><td>Same fungus, concentrates sugar/flavour deliberately for sweet wine</td></tr>
            <tr><td>Phylloxera</td><td>Root-feeding aphid</td><td>Solved by grafting onto resistant rootstock: standard practice today</td></tr>
          </table></div>` }
      ],
      quiz: [
        { theme: "Yield control", q: "What is the primary lever for controlling a vine's yield?", options: ["Irrigation timing", "Winter pruning (bud number)", "Leaf removal", "Harvest date"], correct: 1, explain: "Pruning sets the maximum number of buds/shoots: the main yield control decision, made months before the growing season starts." },
        { theme: "Irrigation as quality tool", q: "Deficit irrigation is best described as:", options: ["Watering as much as possible for maximum yield", "Withholding water at controlled points to limit berry size and concentrate flavour", "An emergency response to drought", "A method only used in flood irrigation"], correct: 1, explain: "It's a deliberate, precise quality tool, not a survival measure, used where irrigation is legal and available." },
        { theme: "Noble rot", q: "Grey rot and noble rot are:", options: ["Different fungi entirely", "The same fungus (Botrytis cinerea) under different conditions", "Only found in Sauternes", "Unrelated to humidity"], correct: 1, explain: "Botrytis cinerea causes spoilage (grey rot) in wet/humid conditions, but deliberately concentrates sugar (noble rot) when morning mist is followed by drying afternoon sun." },
        { theme: "Phylloxera & rootstock", q: "Phylloxera was historically controlled by:", options: ["Fungicide spraying", "Grafting vinifera onto resistant rootstock", "Switching to machine harvest", "Deficit irrigation"], correct: 1, explain: "Grafting European vinifera onto phylloxera-resistant American rootstock is standard practice today, aside from rare sandy-soil exceptions." }
      ]
    },
    {
      id: "winemaking",
      group: "foundations",
      groupLabel: "Foundations",
      title: "Winemaking",
      tagline: "What happens after harvest: white, rosé, red, and sweet wine production paths.",
      sections: [
        { h: "White winemaking", body: `
          <ol>
            <li>Pressed before fermentation (skins removed early) to avoid extracting tannin/colour.</li>
            <li>Optional brief <strong>skin contact</strong> pre-fermentation to lift aroma/flavour compounds.</li>
            <li>Fermentation often cool (12–18°C) in stainless steel for fresh fruit aromatics; barrel fermentation builds texture for fuller styles.</li>
            <li>Optional <strong>malolactic conversion</strong>: sharp malic acid → softer lactic acid + buttery diacetyl. Used for round styles (Chardonnay), avoided for aromatic/high-acid styles (Riesling).</li>
            <li>Optional <strong>lees ageing (sur lie)</strong>: adds texture and, with extended contact, bready autolytic character.</li>
          </ol>` },
        { h: "Rosé: three methods", body: `
          <div class="table-wrap"><table class="data">
            <tr><th>Method</th><th>Process</th><th>Result</th></tr>
            <tr><td>Direct pressing</td><td>Immediate press, brief skin contact only</td><td>Palest, most delicate (Provence style)</td></tr>
            <tr><td>Short maceration</td><td>Brief skin contact, pressed off as if for white</td><td>Light–medium colour, more fruit character</td></tr>
            <tr><td>Saignée</td><td>Juice "bled off" early from a red fermentation</td><td>Often deeper colour; a byproduct of concentrating the remaining red</td></tr>
          </table></div>` },
        { h: "Red winemaking", body: `
          <p>Juice ferments together with skins/seeds: the core difference from white winemaking: colour, tannin, and flavour are all extracted during fermentation. <strong>Cap management</strong> (punch-down or pump-over) mixes the floating cap of skins back into the fermenting juice. <strong>Extended maceration</strong> beyond fermentation adds more tannin/colour/structure for age-worthy styles. <strong>Free-run juice</strong> (higher quality) vs <strong>press wine</strong> (more tannic) may be blended back in varying proportions.</p>` },
        { h: "Carbonic maceration", body: `
          <p>Whole uncrushed bunches ferment intracellularly in a CO₂-rich sealed environment, producing low-tannin, fruity wines for early drinking: the Beaujolais signature.</p>` },
        { h: "Sweet wine, in brief", body: `
          <p>Late harvest (extended hang time), noble rot (Sauternes, Alsace SGN, Tokaji), and fortification (see <strong>04_fortified</strong>) all retain sugar by different mechanisms. Chaptalization adds sugar <em>before</em> fermentation to raise potential alcohol: it is not a sweetening technique, since that sugar ferments fully to alcohol.</p>` }
      ],
      quiz: [
        { theme: "Malolactic conversion", q: "Malolactic conversion changes:", options: ["Tartaric acid into malic acid", "Malic acid into softer lactic acid", "Sugar into alcohol", "Tannin into colour"], correct: 1, explain: "MLC softens a wine's perceived acidity and can add buttery diacetyl character: used for fuller styles, avoided for aromatic/high-acid whites." },
        { theme: "Rosé methods", q: "Which rosé method involves bleeding off juice early from a red wine fermentation?", options: ["Direct pressing", "Short maceration", "Saignée", "Carbonic maceration"], correct: 2, explain: "Saignée concentrates the remaining red wine while producing rosé as a secondary product." },
        { theme: "Red vs white winemaking", q: "What is the defining structural difference between red and white winemaking?", options: ["Reds always use more oak", "Reds ferment with skins/seeds in contact with the juice", "Whites always use wild yeast", "Reds are always chaptalized"], correct: 1, explain: "Fermenting on the skins is what extracts colour and tannin: the core mechanism separating red from white winemaking." },
        { theme: "Chaptalization", q: "Chaptalization is best described as:", options: ["Adding sugar to sweeten the finished wine", "Adding acid to a warm-climate must", "Adding sugar before/during fermentation to raise potential alcohol", "A method of fortification"], correct: 2, explain: "The added sugar ferments fully to alcohol: it corrects under-ripeness, it does not add residual sweetness." }
      ]
    },
    {
      id: "oak",
      group: "foundations",
      groupLabel: "Foundations",
      title: "Oak",
      tagline: "Flavour, tannin, and micro-oxygenation: three separate effects that are easy to conflate.",
      sections: [
        { h: "Three effects, not one", body: `
          <ol>
            <li><strong>Flavour</strong>: vanilla, toast, spice, coconut, smoke.</li>
            <li><strong>Tannin/structure</strong>: new oak especially adds tannin and ageing potential.</li>
            <li><strong>Micro-oxygenation</strong>: barrels aren't airtight; slow oxygen ingress softens tannins and stabilises colour (reds), and can add nutty/oxidative complexity (whites).</li>
          </ol>` },
        { h: "New vs old, size, and origin", body: `
          <div class="table-wrap"><table class="data">
            <tr><th></th><th>French oak</th><th>American oak</th></tr>
            <tr><td>Grain</td><td>Tight</td><td>Looser/wider</td></tr>
            <tr><td>Flavour</td><td>Subtle spice, cedar, fine tannin</td><td>Bolder vanilla, coconut, dill</td></tr>
            <tr><td>Cost</td><td>More expensive</td><td>Cheaper</td></tr>
            <tr><td>Typical use</td><td>Bordeaux, Burgundy, many premium reds/whites</td><td>Traditional Rioja, some New World Cabernet/Shiraz</td></tr>
          </table></div>
          <p>Barrel size matters too: a <strong>barrique</strong> (~225L) has a high surface-area-to-volume ratio (strong influence); a <strong>foudre</strong> (1,000L+) gives low relative flavour impact while still allowing micro-oxygenation.</p>` },
        { h: "Alternatives and where oak is avoided", body: `
          <p>Oak chips/staves in inert vessels add flavour cheaply but skip the micro-oxygenation/structural benefit: a real cost/quality marker. Oak is minimised or avoided for aromatic whites (Riesling, most Sauvignon Blanc, Muscat) where varietal aromatics are the point.</p>` }
      ],
      quiz: [
        { theme: "Oak's three effects", q: "Which of these is NOT one of oak's three effects on wine?", options: ["Flavour compounds", "Micro-oxygenation", "Malolactic conversion", "Tannin/structure"], correct: 2, explain: "Malolactic conversion is a bacterial process unrelated to the oak vessel itself: a common point of confusion." },
        { theme: "Oak vessel size", q: "Compared to a barrique, a large foudre gives:", options: ["More oak flavour, no oxygenation", "Less relative oak flavour, but still some micro-oxygenation", "Identical influence, just holds more wine", "No oxygenation and no flavour"], correct: 1, explain: "Foudres have a much lower surface-area-to-volume ratio, so oak flavour is muted, but the wine still ages via oxygen ingress through the wood." },
        { theme: "Oak alternatives", q: "Oak chips/staves in a steel tank provide:", options: ["Flavour and micro-oxygenation", "Flavour compounds but no micro-oxygenation benefit", "Micro-oxygenation only", "Tannin removal"], correct: 1, explain: "Chips add flavour cheaply but an inert steel tank doesn't allow the slow oxygen ingress a real barrel does." },
        { theme: "Oak & aromatic whites", q: "Why is oak typically avoided for Riesling?", options: ["Riesling can't survive barrel ageing", "Oak would mask its delicate varietal aromatics and freshness", "Riesling has too much tannin already", "It's a legal restriction in all Riesling regions"], correct: 1, explain: "Aromatic, high-acid whites are valued for freshness and varietal character, which oak flavour would overwhelm." }
      ]
    },
    {
      id: "service",
      group: "foundations",
      groupLabel: "Foundations",
      title: "Service & Storage",
      tagline: "Cellar conditions and decanting: practical exam knowledge the climate/soil chain doesn't cover.",
      sections: [
        { h: "Storing wine for long-term ageing", body: `
          <div class="table-wrap"><table class="data">
            <tr><th>Condition</th><th>Why it matters</th></tr>
            <tr><td>Lying on its side (cork-sealed)</td><td>Keeps the cork moist and swollen, preventing air ingress</td></tr>
            <tr><td>Cool, constant temperature (~10–15°C)</td><td>Fluctuations expand/contract the wine and cork, pushing air in and accelerating ageing</td></tr>
            <tr><td>Dark</td><td>Strong light, especially UV, can cause off-flavours (light-strike)</td></tr>
            <tr><td>High, steady humidity (~70–80%)</td><td>Too dry and the cork shrinks and lets air in; too damp risks label/mould issues, so steady matters more than maximal</td></tr>
            <tr><td>Away from vibration</td><td>Constant disturbance stresses the wine and unsettles sediment over years of storage</td></tr>
          </table></div>` },
        { h: "Decanting: two different purposes", body: `
          <p>Decanting an <strong>old, fragile wine with sediment</strong> is about separation: pour slowly and steadily in one motion, stopping before sediment reaches the neck. Decanting a <strong>young, tannic wine</strong> is about aeration: a more vigorous pour (or a longer time in the decanter) softens tannin and opens up aromas. Same action, opposite technique, because the goal is different.</p>
          <div class="callout"><span class="callout-label">The full service sequence for an old, fragile bottle</span>
          <blockquote>Move it from the rack to the decanting position without agitating it, ideally well ahead of service. Remove the capsule and clean the neck and shoulder. Ease the cork out gently, since old corks are fragile. Hold the bottle in front of a light source (a candle works) as you pour, and stop the moment sediment reaches the neck.</blockquote></div>` }
      ],

        { h: "Sherry: flor vs oxidative ageing", body: `
          <p>Made from Palomino grapes (Pedro Ximénez is used for a separate, very sweet, raisined style). After fermentation to dryness, wines are fortified and aged in a <strong>solera</strong> system, a fractional blending system across many barrels of different ages, giving a consistent house style year to year. Two main paths: <strong>Fino/Manzanilla</strong>, aged under a living layer of yeast (flor) that protects the wine from oxygen, giving a pale, fresh, tangy style; <strong>Oloroso</strong>, fortified to a higher strength that kills off flor, ageing oxidatively instead, giving a darker, nuttier, richer style.</p>` },
        { h: "Port: timing plus ageing style", body: `
          <p>Made in the Douro, Portugal. Fermentation is stopped early by fortification, while substantial grape sugar remains, giving a sweet, full-bodied red base style. From there, ageing choices diverge: <strong>Ruby</strong>-style Ports age briefly, in tank or large neutral vessels, preserving fresh, fruity character; <strong>Tawny</strong>-style Ports age for years in smaller old oak, developing nutty, dried-fruit, oxidative complexity. <strong>Vintage Port</strong> is bottled young then ages for decades in bottle, forming heavy sediment: see the <strong>Service &amp; Storage</strong> topic for how to decant it.</p>` },

        { h: "Climate", body: `<p><strong>Warm, Mediterranean.</strong> The Mistral, a strong, dry wind funnelling down the Rhône valley, reduces disease pressure but can physically damage vines and cause coulure (poor fruit set) at flowering. Drought is a real risk; rain at harvest generally is not, unlike Bordeaux or Burgundy.</p>` },

  /* ============ RENDER: CLIMATE SIGNATURE CANVAS ============ */

  function drawSignature(canvas, sig) {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(rect.width, 300);
    var h = 46;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    var trackY = 26, trackH = 10;
    // track background
    ctx.fillStyle = "rgba(128,128,128,0.15)";
    roundRect(ctx, 0, trackY, w, trackH, 5);
    ctx.fill();

    // gradient bar for diurnal range (night color -> day color)
    var x0 = (sig.low / 100) * w;
    var x1 = (sig.high / 100) * w;
    var grad = ctx.createLinearGradient(x0, 0, x1, 0);
    grad.addColorStop(0, "#5B6FA8");
    grad.addColorStop(1, "#D9A441");
    ctx.fillStyle = grad;
    roundRect(ctx, x0, trackY, Math.max(x1 - x0, 4), trackH, 5);
    ctx.fill();

    // low/high markers
    ctx.fillStyle = "#5B6FA8";
    ctx.beginPath(); ctx.arc(x0, trackY + trackH / 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#D9A441";
    ctx.beginPath(); ctx.arc(x1, trackY + trackH / 2, 4, 0, Math.PI * 2); ctx.fill();

    // rainfall dots above
    var dotCount = 14;
    var activeDots = Math.round(dotCount * sig.rainfall);
    for (var i = 0; i < dotCount; i++) {
      var dx = (w / dotCount) * (i + 0.5);
      ctx.beginPath();
      ctx.arc(dx, 8, 2.3, 0, Math.PI * 2);
      ctx.fillStyle = i < activeDots ? "rgba(124,33,66,0.55)" : "rgba(128,128,128,0.18)";
      ctx.fill();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

      sectionsHtml +
      renderQuizSection(topic) +
      renderTopicNav(topic);

      var canvas = main.querySelector("#sigCanvas");

  function renderQuizSection(topic) {
    var st = state[topic.id] || { answered: {}, correctCount: 0 };
    var answeredCount = Object.keys(st.answered || {}).length;
    var cards = topic.quiz.map(function (q, qi) {
      var savedAnswer = st.answered ? st.answered[qi] : undefined;
      var options = q.options.map(function (opt, oi) {
        var cls = "quiz-option";
        var letter = String.fromCharCode(65 + oi);
        if (savedAnswer !== undefined) {
          if (oi === q.correct) cls += " correct";
          else if (oi === savedAnswer) cls += " incorrect";
          else cls += " dimmed";
        }
        return '<button class="' + cls + '" data-qi="' + qi + '" data-oi="' + oi + '" ' + (savedAnswer !== undefined ? "disabled" : "") + '>' +
          '<span class="opt-letter">' + letter + '</span><span>' + opt + '</span></button>';
      }).join("");
      return '<div class="quiz-card" data-qi="' + qi + '">' +
        (q.theme ? '<span class="theme-tag">' + q.theme + '</span>' : "") +
        '<div class="quiz-q">' + (qi + 1) + '. ' + q.q + '</div>' +
        '<div class="quiz-options">' + options + '</div>' +
        '<div class="quiz-explain' + (savedAnswer !== undefined ? " show" : "") + '"><b>Why: </b>' + q.explain + '</div>' +
      '</div>';
    }).join("");

    return '<div class="quiz-section">' +
      '<div class="quiz-title-row"><h3>Quick check</h3><span class="quiz-score">' + (st.correctCount || 0) + ' / ' + topic.quiz.length + ' correct · ' + answeredCount + ' / ' + topic.quiz.length + ' answered</span></div>' +
      cards +
    '</div>';
  }

  function wireQuiz(topic) {
    var main = document.getElementById("main");
    main.querySelectorAll(".quiz-option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var qi = parseInt(btn.getAttribute("data-qi"), 10);
        var oi = parseInt(btn.getAttribute("data-oi"), 10);
        recordAnswer(topic, qi, oi);
        renderTopic(topic); // re-render to lock in state
      });
    });
  }

  function recordAnswer(topic, qi, oi) {
    if (!state[topic.id]) state[topic.id] = { answered: {}, correctCount: 0 };
    var s = state[topic.id];
    if (s.answered[qi] !== undefined) return; // already answered
    s.answered[qi] = oi;
    if (oi === topic.quiz[qi].correct) s.correctCount = (s.correctCount || 0) + 1;
    saveProgress();
    renderSidebar();
  }

  function allWrittenPrompts(filter) {
    var list = [];
    TOPICS.forEach(function (t) {
      if (filter !== "all" && t.group !== filter) return;
      (WRITTEN[t.id] || []).forEach(function (w, idx) {
        list.push({ topicId: t.id, topicTitle: t.title, groupLabel: t.groupLabel, idx: idx, data: w });
      });
    });
    return list;
  }

  function pickRandomPrompt(filter) {
    var pool = allWrittenPrompts(filter);
    if (!pool.length) return null;
    var candidates = pool;
    if (wpState.current && pool.length > 1) {
      var curKey = wpState.current.topicId + ":" + wpState.current.idx;
      candidates = pool.filter(function (p) { return (p.topicId + ":" + p.idx) !== curKey; });
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function pickRandomScenario() {
    if (!SCENARIOS.length) return null;
    var candidates = SCENARIOS;
    if (scState.current && SCENARIOS.length > 1) {
      candidates = SCENARIOS.filter(function (s) { return s.id !== scState.current.id; });
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

      return;
    }

    var cardHtml;
    if (entry) {
      var w = entry.data;

      cardHtml = '<div class="written-card">' +
        '<div class="written-command">' + w.command + '</div>' +
        '<span class="mcq-topic-tag">' + entry.groupLabel + ' · ' + entry.topicTitle + '</span>' +
        (w.theme ? '<span class="theme-tag">' + w.theme + '</span>' : "") +
        (w.anchor ? '<div class="written-anchor">' + w.anchor + '</div>' : "") +
        '<div class="written-q">' + w.q + '</div>' +
        '<textarea class="written-textarea" id="wpAnswer" placeholder="Write your answer here…">' + escapeHtml(wpState.userAnswer || "") + '</textarea>' +
        '<div class="written-actions">' +
          '<button class="btn primary" id="wpReveal">Reveal model answer</button>' +
          '<button class="btn" id="wpNew">New question</button>' +
        '</div>' +
        (wpState.revealed ?
          '<div class="reveal-block">' +
            '<div class="callout"><span class="callout-label">Model answer</span><blockquote>"' + w.model + '"</blockquote></div>' +
          '</div>'
        : "") +
      '</div>';
    } else {
      cardHtml = '<div class="written-card">No prompts in this filter yet.</div>';
    }

    main.innerHTML =
      '<div class="practice-hero">' +
        '<h2>Written Practice</h2>' +
        '<p class="sub">Pick a question, write your answer under real exam conditions, then reveal a model answer to check your work.</p>' +
      '</div>' +
      '<div class="filter-row">' + filterChips + '</div>' +
      renderGlossary() +
      cardHtml;

    wireWrittenPractice();
  }

  function wireWrittenPractice() {
    var main = document.getElementById("main");
    main.querySelectorAll(".filter-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        wpState.filter = btn.getAttribute("data-filter");
        if (wpState.filter === "scenarios") {
          scState.current = pickRandomScenario();
          scState.revealed = false;
        } else {
          wpState.current = pickRandomPrompt(wpState.filter);
          resetWpAnswerState();
        }
        renderWrittenPractice();
      });
    });
    var scRevealBtn = main.querySelector("#scReveal");
    if (scRevealBtn) scRevealBtn.addEventListener("click", function () {
      scState.revealed = true;
      renderWrittenPractice();
    });
    var scNewBtn = main.querySelector("#scNew");
    if (scNewBtn) scNewBtn.addEventListener("click", function () {
      scState.current = pickRandomScenario();
      scState.revealed = false;
      renderWrittenPractice();
    });
    var ta = main.querySelector("#wpAnswer");
    if (ta) ta.addEventListener("input", function () { wpState.userAnswer = ta.value; });
    var revealBtn = main.querySelector("#wpReveal");
    if (revealBtn) revealBtn.addEventListener("click", function () {
      wpState.revealed = true;
      renderWrittenPractice();
    });
    var newBtn = main.querySelector("#wpNew");
    if (newBtn) newBtn.addEventListener("click", function () {
      wpState.current = pickRandomPrompt(wpState.filter);
      resetWpAnswerState();
      renderWrittenPractice();
    });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ============ RENDER: MULTIPLE CHOICE PRACTICE ============ */

  function allMcqQuestions(filter) {
    var list = [];
    TOPICS.forEach(function (t) {
      if (filter !== "all" && t.group !== filter) return;
      t.quiz.forEach(function (q, idx) {
        list.push({ topicId: t.id, topicTitle: t.title, groupLabel: t.groupLabel, idx: idx, data: q });
      });
    });
    return list;
  }

  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function renderMcqPractice() {
    var main = document.getElementById("main");
    if (mcqState.phase === "setup") main.innerHTML = renderMcqSetup();
    else if (mcqState.phase === "running") main.innerHTML = renderMcqRunning();
    else main.innerHTML = renderMcqSummary();
    wireMcqPractice();
  }

  function renderMcqSetup() {
    var filterLabels = { all: "All topics", foundations: "Foundations", regions: "Regions" };
    var filterChips = ["all", "foundations", "regions"].map(function (f) {
      return '<button class="filter-chip' + (mcqState.filter === f ? " active" : "") + '" data-filter="' + f + '">' + filterLabels[f] + '</button>';
    }).join("");
    var poolSize = allMcqQuestions(mcqState.filter).length;
    var statsHtml = '<div class="mcq-stats-row"><span>Best score: ' + (mcqStats.best || 0) + '</span>' +
      (mcqStats.lastScore !== null ? '<span>Last attempt: ' + mcqStats.lastScore + ' / ' + mcqStats.lastTotal + '</span>' : '') + '</div>';
    return '<div class="practice-hero">' +
        '<h2>Multiple Choice Practice</h2>' +
        '<p class="sub">A shuffled set pulled from every topic\'s quick check. Answer, see the explanation immediately, then move on: this is drilling recall, not first-time learning.</p>' +
      '</div>' +
      '<div class="filter-row">' + filterChips + '</div>' +
      statsHtml +
      '<div class="written-actions" style="margin-top:1.2rem;"><button class="btn primary" id="mcqStart" ' + (poolSize ? "" : "disabled") + '>Start practice set (' + poolSize + ' questions)</button></div>';
  }

  function renderMcqRunning() {
    var total = mcqState.pool.length;
    var item = mcqState.pool[mcqState.index];
    var q = item.data;
    var answered = mcqState.answered;
    var optionsHtml = q.options.map(function (opt, oi) {
      var cls = "quiz-option";
      var letter = String.fromCharCode(65 + oi);
      if (answered !== null) {
        if (oi === q.correct) cls += " correct";
        else if (oi === answered) cls += " incorrect";
        else cls += " dimmed";
      }
      return '<button class="' + cls + '" data-oi="' + oi + '" ' + (answered !== null ? "disabled" : "") + '>' +
        '<span class="opt-letter">' + letter + '</span><span>' + opt + '</span></button>';
    }).join("");
    var isLast = mcqState.index + 1 >= total;
    return '<div class="mcq-progress">Question ' + (mcqState.index + 1) + ' / ' + total + ' · Score ' + mcqState.score + '</div>' +
      '<div class="quiz-card">' +
        '<span class="mcq-topic-tag">' + item.groupLabel + ' · ' + item.topicTitle + '</span>' +
        (q.theme ? '<span class="theme-tag">' + q.theme + '</span>' : "") +
        '<div class="quiz-q">' + q.q + '</div>' +
        '<div class="quiz-options">' + optionsHtml + '</div>' +
        (answered !== null ? '<div class="quiz-explain show"><b>Why: </b>' + q.explain + '</div>' : '') +
      '</div>' +
      (answered !== null ?
        '<div class="written-actions"><button class="btn primary" id="mcqNext">' + (isLast ? "See results" : "Next question") + '</button></div>'
        : "");
  }

  function renderMcqSummary() {
    var total = mcqState.results.length;
    var itemsHtml = mcqState.results.map(function (r) {
      return '<li class="mcq-summary-item ' + (r.correct ? "right" : "wrong") + '"><strong>' + r.topicTitle + ':</strong> ' + r.q + '<br><span style="color:var(--muted);">' + r.explain + '</span></li>';
    }).join("");
    return '<div class="practice-hero"><h2>Results</h2></div>' +
      '<div class="written-card"><div style="font-size:2rem;font-family:var(--font-display);">' + mcqState.score + ' / ' + total + '</div>' +
      (mcqState.isNewBest ? '<div style="color:var(--good);font-family:var(--font-mono);font-size:0.85rem;margin-top:0.3rem;">New best score!</div>' : '') +
      '</div>' +
      '<ul class="mcq-summary-list">' + itemsHtml + '</ul>' +
      '<div class="written-actions" style="margin-top:1.5rem;"><button class="btn primary" id="mcqAgain">Practice again</button></div>';
  }

  function wireMcqPractice() {
    var main = document.getElementById("main");
    main.querySelectorAll(".filter-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        mcqState.filter = btn.getAttribute("data-filter");
        renderMcqPractice();
      });
    });
    var startBtn = main.querySelector("#mcqStart");
    if (startBtn) startBtn.addEventListener("click", function () {
      mcqState.pool = shuffleArr(allMcqQuestions(mcqState.filter));
      mcqState.index = 0;
      mcqState.score = 0;
      mcqState.answered = null;
      mcqState.results = [];
      mcqState.isNewBest = false;
      mcqState.phase = "running";
      renderMcqPractice();
    });
    main.querySelectorAll(".quiz-option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var oi = parseInt(btn.getAttribute("data-oi"), 10);
        var item = mcqState.pool[mcqState.index];
        var isCorrect = oi === item.data.correct;
        mcqState.answered = oi;
        if (isCorrect) mcqState.score++;
        mcqState.results.push({ topicTitle: item.topicTitle, q: item.data.q, explain: item.data.explain, correct: isCorrect });
        renderMcqPractice();
      });
    });
    var nextBtn = main.querySelector("#mcqNext");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      if (mcqState.index + 1 < mcqState.pool.length) {
        mcqState.index++;
        mcqState.answered = null;
        renderMcqPractice();
      } else {
        var prevBest = mcqStats.best || 0;
        mcqStats.lastScore = mcqState.score;
        mcqStats.lastTotal = mcqState.pool.length;
        mcqState.isNewBest = mcqState.score > prevBest && mcqState.pool.length > 0;
        if (mcqState.isNewBest) mcqStats.best = mcqState.score;
        saveMcqStats();
        mcqState.phase = "summary";
        renderMcqPractice();
      }
    });
    var againBtn = main.querySelector("#mcqAgain");
    if (againBtn) againBtn.addEventListener("click", function () {
      mcqState.phase = "setup";
      renderMcqPractice();
    });
  }

  /* ============ RENDER: RESPONSE BUILDER ============ */

  function pickRandomBuilder() {
    var candidates = RESPONSE_BUILDERS;
    if (rbState.current && RESPONSE_BUILDERS.length > 1) {
      candidates = RESPONSE_BUILDERS.filter(function (b) { return b.id !== rbState.current; });
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function currentBuilder() {
    if (!rbState.current) rbState.current = pickRandomBuilder().id;
    return RESPONSE_BUILDERS.find(function (b) { return b.id === rbState.current; }) || RESPONSE_BUILDERS[0];
  }

  function resetBuilderProgress() {
    rbState.stepIndex = 0;
    rbState.selections = [];
  }

  function renderResponseBuilder() {
    var main = document.getElementById("main");
    var builder = currentBuilder();
    var total = builder.steps.length;
    var totalMarks = builder.steps.reduce(function (sum, s) { return sum + s.marks; }, 0);
    var solvedCount = rbState.selections.filter(function (s) { return s && s.solved; }).length;

    var progressPct = total ? Math.round((solvedCount / total) * 100) : 0;
    var progressHtml =
      '<div class="rb-progress-wrap">' +
        '<div class="rb-progress-bar"><div class="rb-progress-fill" style="width:' + progressPct + '%"></div></div>' +
        '<span class="rb-progress-label">' + solvedCount + '/' + total + ' steps</span>' +
        '<button class="rb-reset-btn" id="rbReset">&#8635; Reset</button>' +
      '</div>';

    var bodyHtml;
    if (solvedCount >= total) {
      var summaryHtml = builder.steps.map(function (step, i) {
        var correctOpt = step.options.find(function (o) { return o.correct; });
        return '<li><strong>' + step.label + ':</strong> ' + correctOpt.text + '</li>';
      }).join("");
      bodyHtml =
        '<div class="rb-complete">' +
          '<div class="callout-label">Full answer, built step by step</div>' +
          '<ul class="rb-complete-list">' + summaryHtml + '</ul>' +
        '</div>' +
        '<div class="written-actions"><button class="btn primary" id="rbNextQuestion">New question</button></div>';
    } else {
      var stepIndex = rbState.stepIndex;
      var step = builder.steps[stepIndex];
      var sel = rbState.selections[stepIndex];
      var optionsListHtml = step.options.map(function (opt, oi) {
        var isChosen = sel && sel.chosenIndex === oi;
        var stateClass = isChosen ? (opt.correct ? " correct" : " incorrect") : "";
        var feedbackHtml = isChosen ?
          '<div class="rb-option-feedback">' + (opt.correct ? "&#10003; " : "&#10007; ") + opt.feedback + '</div>' : "";
        return '<div class="rb-option' + stateClass + '" data-step="' + stepIndex + '" data-opt="' + oi + '">' +
          '<span class="rb-option-mark"></span><span class="rb-option-text">' + opt.text + '</span>' +
          feedbackHtml +
        '</div>';
      }).join("");

      bodyHtml =
        '<div class="rb-step-card">' +
          '<div class="rb-step-head"><span class="rb-step-num">' + (stepIndex + 1) + '</span><h3>' + step.label + '</h3></div>' +
          '<span class="rb-step-badge">' + step.command + ' &middot; ' + step.marks + (step.marks === 1 ? " mark" : " marks") + '</span>' +
          '<p class="rb-instruction">' + step.instruction + '</p>' +
          '<div class="rb-options">' + optionsListHtml + '</div>' +
          (sel && sel.solved ?
            '<div class="written-actions"><button class="btn primary" id="rbNextStep">' +
            (stepIndex + 1 < total ? "Next step" : "Finish") + '</button></div>' : "") +
        '</div>';
    }

    main.innerHTML =
      '<div class="practice-hero">' +
        '<h2>Response Builder</h2>' +
        '<p class="sub">Build a full-mark answer one step at a time. At each step, pick the option that actually earns the mark, and see exactly why the others don\'t. Cause to effect, in plain English.</p>' +
      '</div>' +
      '<div class="written-card">' +
        '<span class="mcq-topic-tag">' + builder.topicTitle + '</span>' +
        '<div class="scenario-wine">' + builder.wine + '</div>' +
        '<div class="scenario-context">' + builder.context + '</div>' +
        '<div class="rb-badges"><span class="mcq-topic-tag rb-marks-badge">' + totalMarks + ' marks total &middot; ' + total + ' parts</span></div>' +
        '<div class="callout rb-tip"><span class="callout-label">Tip</span>' + builder.tip + '</div>' +
        '<div class="written-actions"><button class="btn" id="rbSkip">New question</button></div>' +
      '</div>' +
      progressHtml +
      bodyHtml;

    wireResponseBuilder();
  }

  function wireResponseBuilder() {
    var main = document.getElementById("main");
    var resetBtn = main.querySelector("#rbReset");
    if (resetBtn) resetBtn.addEventListener("click", function () {
      resetBuilderProgress();
      renderResponseBuilder();
    });
    main.querySelectorAll(".rb-option").forEach(function (el) {
      el.addEventListener("click", function () {
        var stepIndex = parseInt(el.getAttribute("data-step"), 10);
        var optIndex = parseInt(el.getAttribute("data-opt"), 10);
        var builder = currentBuilder();
        var opt = builder.steps[stepIndex].options[optIndex];
        rbState.selections[stepIndex] = { chosenIndex: optIndex, solved: !!opt.correct };
        renderResponseBuilder();
      });
    });
    var nextStepBtn = main.querySelector("#rbNextStep");
    if (nextStepBtn) nextStepBtn.addEventListener("click", function () {
      rbState.stepIndex++;
      renderResponseBuilder();
    });
    function pickNewQuestion() {
      rbState.current = pickRandomBuilder().id;
      resetBuilderProgress();
      renderResponseBuilder();
    }
    var nextQBtn = main.querySelector("#rbNextQuestion");
    if (nextQBtn) nextQBtn.addEventListener("click", pickNewQuestion);
    var skipBtn = main.querySelector("#rbSkip");
    if (skipBtn) skipBtn.addEventListener("click", pickNewQuestion);
  }

  /* ============ RENDER: MATCH GAME ============ */

  function startMatchRound() {
    var pool = shuffleArr(MATCH_PAIRS.map(function (p, i) { return i; }));
    var picked = [];
    var usedGrapes = {};
    var usedRegions = {};
    // Greedy pick avoiding duplicate grape names or duplicate region names in one round,
    // so e.g. Cabernet Sauvignon (Left Bank Bordeaux) and Cabernet Sauvignon (Coonawarra)
    // never appear together and create an ambiguous match.
    pool.forEach(function (idx) {
      if (picked.length >= ROUND_SIZE) return;
      var p = MATCH_PAIRS[idx];
      if (usedGrapes[p.grape] || usedRegions[p.region]) return;
      picked.push(idx);
      usedGrapes[p.grape] = true;
      usedRegions[p.region] = true;
    });
    matchState.roundPairs = picked;
    matchState.grapeOrder = shuffleArr(picked);
    matchState.regionOrder = shuffleArr(picked);
    matchState.matched = {};
    matchState.selectedGrape = null;
    matchState.selectedRegion = null;
    matchState.wrongPair = null;
    matchState.mistakes = 0;
    matchState.history = [];
  }

  function renderMatchGame() {
    var main = document.getElementById("main");
    if (!matchState.roundPairs.length) startMatchRound();

    var allMatched = matchState.roundPairs.length > 0 &&
      matchState.roundPairs.every(function (i) { return matchState.matched[i]; });

    var grapeTiles = matchState.grapeOrder.map(function (idx) {
      var pair = MATCH_PAIRS[idx];
      var cls = "match-tile";
      if (matchState.matched[idx]) cls += " matched";
      else if (matchState.selectedGrape === idx) cls += " selected";
      else if (matchState.wrongPair && matchState.wrongPair.grape === idx) cls += " wrong";
      return '<button class="' + cls + '" data-grape="' + idx + '" ' + (matchState.matched[idx] ? "disabled" : "") + '>' + pair.grape + '</button>';
    }).join("");

    var regionTiles = matchState.regionOrder.map(function (idx) {
      var pair = MATCH_PAIRS[idx];
      var cls = "match-tile";
      if (matchState.matched[idx]) cls += " matched";
      else if (matchState.selectedRegion === idx) cls += " selected";
      else if (matchState.wrongPair && matchState.wrongPair.region === idx) cls += " wrong";
      return '<button class="' + cls + '" data-region="' + idx + '" ' + (matchState.matched[idx] ? "disabled" : "") + '>' + pair.region + '</button>';
    }).join("");

    var flashHtml = "";
    if (matchState.history.length) {
      var latest = MATCH_PAIRS[matchState.history[matchState.history.length - 1]];
      var listify = function (items) { return '<ul class="mf-list">' + items.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul>'; };
      flashHtml = '<div class="match-flash">' +
        '<div class="mf-pair">' + latest.grape + '<span class="arrow">&harr;</span>' + latest.region + '</div>' +
        '<div class="mf-cols">' +
          '<div><div class="mf-side"><b>Grape profile</b>' + listify(latest.profile) + '</div>' +
          '<div class="mf-side"><b>Grape characteristics</b>' + listify(latest.chars) + '</div></div>' +
          '<div class="mf-side"><b>Region climate</b>' + listify(latest.climate) + '</div>' +
        '</div>' +
      '</div>';
    }

    var historyHtml = "";
    if (matchState.history.length) {
      historyHtml = '<div class="match-history">' + matchState.history.map(function (idx) {
        var p = MATCH_PAIRS[idx];
        return '<div class="match-history-item"><span><strong>' + p.grape + '</strong> &harr; ' + p.region + '</span></div>';
      }).reverse().join("") + '</div>';
    }

    var statsHtml = '<div class="match-stats-row"><span>Rounds played: ' + matchStats.roundsPlayed + '</span><span>Correct: ' + matchStats.totalCorrect + '</span><span>Mistakes: ' + matchStats.totalWrong + '</span></div>';

    var actionHtml = allMatched
      ? '<div class="written-actions"><button class="btn primary" id="matchNext">New round (' + matchState.mistakes + ' mistake' + (matchState.mistakes === 1 ? "" : "s") + ' this round)</button></div>'
      : '<div class="mcq-progress">' + Object.keys(matchState.matched).length + ' / ' + matchState.roundPairs.length + ' matched · ' + matchState.mistakes + ' mistake' + (matchState.mistakes === 1 ? "" : "s") + ' this round</div>';

    main.innerHTML =
      '<div class="practice-hero">' +
        '<h2>Grape &harr; Region Match</h2>' +
        '<p class="sub">Click a grape, then click its region. Every correct match flashes the grape\'s colour and style next to the region\'s climate: the repetition is the point. Wrong guesses just bounce back, no penalty beyond the count.</p>' +
      '</div>' +
      statsHtml +
      (allMatched ? "" : '<div class="mcq-progress" style="margin-bottom:0.6rem;">' + Object.keys(matchState.matched).length + ' / ' + matchState.roundPairs.length + ' matched · ' + matchState.mistakes + ' mistake' + (matchState.mistakes === 1 ? "" : "s") + ' this round</div>') +
      '<div class="match-grid">' +
        '<div><div class="match-col-label">Grape</div><div class="match-col">' + grapeTiles + '</div></div>' +
        '<div><div class="match-col-label">Region</div><div class="match-col">' + regionTiles + '</div></div>' +
      '</div>' +
      (allMatched ? '<div class="written-actions" style="margin-bottom:1.5rem;"><button class="btn primary" id="matchNext">New round</button></div>' : "") +
      flashHtml +
      historyHtml;

    wireMatchGame();
  }

  function wireMatchGame() {
    var main = document.getElementById("main");
    main.querySelectorAll("[data-grape]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        matchState.selectedGrape = parseInt(btn.getAttribute("data-grape"), 10);
        matchState.wrongPair = null;
        attemptMatch();
      });
    });
    main.querySelectorAll("[data-region]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        matchState.selectedRegion = parseInt(btn.getAttribute("data-region"), 10);
        matchState.wrongPair = null;
        attemptMatch();
      });
    });
    var nextBtn = main.querySelector("#matchNext");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      matchStats.roundsPlayed++;
      saveMatchStats();
      startMatchRound();
      renderMatchGame();
    });
  }

  function attemptMatch() {
    if (matchState.selectedGrape === null || matchState.selectedRegion === null) {
      renderMatchGame();
      return;
    }
    if (matchState.selectedGrape === matchState.selectedRegion) {
      matchState.matched[matchState.selectedGrape] = true;
      matchState.history.push(matchState.selectedGrape);
      matchStats.totalCorrect++;
      matchState.selectedGrape = null;
      matchState.selectedRegion = null;
      saveMatchStats();
      renderMatchGame();
    } else {
      matchState.mistakes++;
      matchStats.totalWrong++;
      matchState.wrongPair = { grape: matchState.selectedGrape, region: matchState.selectedRegion };
      saveMatchStats();
      renderMatchGame();
      setTimeout(function () {
        matchState.selectedGrape = null;
        matchState.selectedRegion = null;
        matchState.wrongPair = null;
        renderMatchGame();
      }, 650);
    }
  }

  /* ============ NAVIGATION ============ */

  function renderCurrentView() {
    if (currentView === "written-practice") { renderWrittenPractice(); return; }
    if (currentView === "mcq-practice") { renderMcqPractice(); return; }
    if (currentView === "response-builder") { renderResponseBuilder(); return; }
    if (currentView === "match-game") { renderMatchGame(); return; }
    var topic = TOPICS.find(function (t) { return t.id === currentView; });
    if (topic) renderTopic(topic); else renderHome();
  }

  function navigate(id) {
    currentView = id;
    renderSidebar();
    renderCurrentView();
    window.scrollTo({ top: 0, behavior: "auto" });
    closeSidebarMobile();
  }

  /* ============ MOBILE SIDEBAR ============ */

  function closeSidebarMobile() {
    document.getElementById("sidebar").classList.remove("open");
  }
  document.getElementById("menuToggle").addEventListener("click", function () {
    document.getElementById("sidebar").classList.toggle("open");
  });

  /* ============ RESET ============ */

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (window.confirm("Clear all progress and quiz stats on this device?")) {
      state = {};
      mcqStats = { best: 0, lastScore: null, lastTotal: null };
      matchStats = { roundsPlayed: 0, totalCorrect: 0, totalWrong: 0 };
      saveProgress();
      saveMcqStats();
      saveMatchStats();
      wpState = { filter: "all", current: null, userAnswer: "", revealed: false };
      mcqState = { phase: "setup", filter: "all", pool: [], index: 0, score: 0, answered: null, results: [], isNewBest: false };
      rbState = { current: null, stepIndex: 0, selections: [] };
      matchState = { roundPairs: [], grapeOrder: [], regionOrder: [], matched: {}, selectedGrape: null, selectedRegion: null, wrongPair: null, mistakes: 0, history: [] };
      renderSidebar();
      renderCurrentView();
    }
  });

  /* ============ ACCESS GATE ============ */
  /* Client-side only: keeps the site off the open internet for casual visitors.
     Not real security, since the source (including this password) is visible
     to anyone who views page source. Change GATE_PASSWORD below to your own code. */

  var GATE_KEY = "fieldsheets-unlocked-v1";
  var GATE_PASSWORD = "wset3";

  function tryUnlock() {
    var input = document.getElementById("gatePw");
    var err = document.getElementById("gateError");
    if (input.value === GATE_PASSWORD) {
      try { localStorage.setItem(GATE_KEY, "1"); } catch (e) {}
      document.body.classList.add("unlocked");
      err.classList.remove("show");
    } else {
      err.classList.add("show");
    }
  }
  document.getElementById("gateBtn").addEventListener("click", tryUnlock);
  document.getElementById("gatePw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });
  var alreadyUnlocked = false;
  try { alreadyUnlocked = localStorage.getItem(GATE_KEY) === "1"; } catch (e) {}
  if (alreadyUnlocked) document.body.classList.add("unlocked");

  /* ============ INIT ============ */

  renderSidebar();
  renderHome();
})();
</script>
